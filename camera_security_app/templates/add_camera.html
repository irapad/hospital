{% extends "base.html" %}

{% block title %}เพิ่มกล้องใหม่ - Camera Security Management{% endblock %}

{% block content %}
<h2>เพิ่มกล้องใหม่</h2>

<form method="POST" action="{{ url_for('add_camera') }}">
    <div class="form-group">
        <label for="ip_address">IP Address *</label>
        <input type="text" id="ip_address" name="ip_address" required placeholder="192.168.1.100">
    </div>

    <div class="form-group">
        <label for="port">Port</label>
        <input type="number" id="port" name="port" value="80" min="1" max="65535">
    </div>

    <div class="form-group">
        <label for="location">สถานที่</label>
        <input type="text" id="location" name="location" placeholder="เช่น อาคาร A ชั้น 2">
    </div>

    <div class="form-group">
        <label for="notes">หมายเหตุ</label>
        <textarea id="notes" name="notes" rows="4" placeholder="ข้อมูลเพิ่มเติมเกี่ยวกับกล้อง..."></textarea>
    </div>

    <div>
        <button type="submit" class="btn btn-success">เพิ่มกล้อง</button>
        <a href="{{ url_for('cameras') }}" class="btn" style="background: #6c757d;">ยกเลิก</a>
    </div>
</form>

{% endblock %}
